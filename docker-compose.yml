services:
  tz-checker:
    build: .
    image: tz-checker:0.3.0
    container_name: tz-checker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ_CHECKER_DATA_DIR: /data
      PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
